# Builds the iOS app on a macOS runner, signs it and uploads it to TestFlight. No Mac needed.
# Run it from GitHub → Actions → "iOS release" → Run workflow.
#
# Signing is automatic ("cloud signing"): Xcode makes the distribution certificate and the
# profile itself, authenticated with an App Store Connect API key (role Admin).
# Repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID      Key ID of the App Store Connect API key
#   ASC_ISSUER_ID   Issuer ID shown above the keys
#   ASC_KEY_P8      the whole text of the AuthKey_XXXX.p8 file
# Spotify is left out on iOS for now (no SPOTIFY_CLIENT_ID), per Spotify's current policy.
name: iOS release

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (blank = the one in pubspec.yaml)'
        required: false

concurrency:
  group: ios-release
  cancel-in-progress: false

env:
  TEAM_ID: KBRZ4UZP79
  VINYLO_API_URL: https://pruzssudez6nz6w4cb6qmbpvei0msrrh.lambda-url.ap-northeast-2.on.aws

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::error::Set the ASC_KEY_P8, ASC_KEY_ID and ASC_ISSUER_ID repository secrets first."; exit 1
          fi
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          chmod 600 "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Flutter build (no signing yet)
        run: |
          NUMBER="${{ inputs.build_number }}"
          flutter build ios --release --no-codesign \
            ${NUMBER:+--build-number=$NUMBER} \
            --dart-define=VINYLO_API_URL=$VINYLO_API_URL

      - name: Archive (signed)
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            archive

      - name: Export and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Remove the key
        if: always()
        run: rm -f "$ASC_KEY_PATH"
